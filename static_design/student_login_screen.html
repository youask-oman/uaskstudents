<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>uask.ai | Student Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .bg-pattern {
            background-color: #f6f6f8;
            background-image: radial-gradient(#135bec 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            background-position: 0 0;
            opacity: 0.15;
        }
        .dark .bg-pattern {
            background-color: #101622;
            background-image: radial-gradient(#135bec 0.5px, transparent 0.5px);
            opacity: 0.1;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Background Decoration -->
<div class="fixed inset-0 z-0 bg-pattern pointer-events-none"></div>
<div class="fixed top-0 left-0 w-full h-full z-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
</div>
<div class="relative z-10 flex h-full grow flex-col">
<!-- Top Navigation -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-black/5 dark:border-white/5 px-6 md:px-10 py-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center gap-3 text-[#111318] dark:text-white">
<div class="size-8 bg-primary rounded-lg flex items-center justify-center text-white">
<svg class="w-6 h-6" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-[#111318] dark:text-white text-xl font-extrabold leading-tight tracking-[-0.015em]">uask.ai</h2>
</div>
<div class="hidden md:block">
<span class="text-sm text-[#616f89] dark:text-gray-400">Master Math &amp; Physics with AI</span>
</div>
</header>
<main class="flex-1 flex items-center justify-center px-4 py-12">
<div class="w-full max-w-[440px] bg-white dark:bg-[#1a212f] rounded-xl shadow-2xl shadow-primary/5 border border-black/5 dark:border-white/5 p-8 flex flex-col">
<!-- Headline -->
<div class="text-center mb-8">
<h1 class="text-[#111318] dark:text-white text-3xl font-bold leading-tight mb-2">Welcome back</h1>
<p class="text-[#616f89] dark:text-gray-400 text-sm">Continue your learning journey</p>
</div>
<!-- Form Section -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-[#111318] dark:text-white text-sm font-semibold leading-normal">Email Address</label>
<input class="form-input w-full rounded-lg text-[#111318] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbdfe6] dark:border-gray-700 bg-white dark:bg-[#101622] focus:border-primary h-12 placeholder:text-[#616f89] px-4 text-sm font-normal" placeholder="name@university.edu" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-[#111318] dark:text-white text-sm font-semibold leading-normal">Password</label>
<a class="text-primary text-xs font-semibold hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="form-input w-full rounded-lg text-[#111318] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbdfe6] dark:border-gray-700 bg-white dark:bg-[#101622] focus:border-primary h-12 placeholder:text-[#616f89] px-4 pr-12 text-sm font-normal" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-[#616f89] hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                        Log In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#dbdfe6] dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-[#1a212f] px-4 text-[#616f89] dark:text-gray-400 font-medium">Or continue with</span>
</div>
</div>
<!-- OAuth Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 border border-[#dbdfe6] dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-white/5 transition-colors group">
<img alt="" class="w-5 h-5" data-alt="Google colorful icon logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJWbywDH8KRd1dJJEkxXYBQ0UsO11AYQEWqePDSRvpdcYQxgbR39aHPFaq1SspnSEpJDyR30md6bK5rcnBFV0WFayiGt1FTjdk0HCY64aR4ivtOCH2eXyR7KwIumZPDpiWw7b47yeX4PEJeKJLFDE9c5M6rgP_wJ5dwdZNM7QcYB47R3CpCL_luMEqdCEUN799qAkfMqCETnzzZl-2mYwUOSKCoHRy1nNrEKQtO4pcYJ33ZDhuEvmKh8f2AoXUjUv_ckHkua-Ecl-k"/>
<span class="text-sm font-semibold text-[#111318] dark:text-white">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 border border-[#dbdfe6] dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-white/5 transition-colors group">
<span class="material-symbols-outlined text-[22px] text-[#111318] dark:text-white">ios</span>
<span class="text-sm font-semibold text-[#111318] dark:text-white">Apple</span>
</button>
</div>
<!-- Footer Toggle -->
<div class="mt-8 text-center">
<p class="text-[#616f89] dark:text-gray-400 text-sm">
                        Don't have an account? 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</main>
<!-- Footer Copyright -->
<footer class="py-6 px-10 text-center">
<p class="text-xs text-[#616f89] dark:text-gray-500">© 2024 uask.ai. All rights reserved. Physics-informed AI for education.</p>
</footer>
</div>
</body></html>
