<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hand-Drawn Tabs Developer Reference</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;family=Gochi+Hand&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0D9488",
                        vibrantYellow: "#FFEE58",
                        stickyNote: "#FFF176",
                        "background-light": "#FFFFFF",
                    },
                    fontFamily: {
                        display: ["'Architects Daughter'", "cursive"],
                        sketch: ["'Gochi Hand'", "cursive"],
                        sans: ["'Inter'", "sans-serif"],
                    },
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        :root {
            --dot-color: #e2e8f0;
            --dot-size: 1px;
            --dot-space: 24px;
        }
        .dot-grid {
            background-image: radial-gradient(var(--dot-color) var(--dot-size), transparent 0);
            background-size: var(--dot-space) var(--dot-space);
        }
        .wobbly-border {
            border: 3px solid #334155;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .sticky-note-shape {
            box-shadow: 5px 5px 0px rgba(0,0,0,0.1);
            transform: rotate(-3deg);
            border: 2px solid #eab308;
            border-radius: 2px 2px 2px 40px / 2px 2px 2px 25px;
        }
        .dashed-sketch-border {
            border: 3px dashed #64748b;
            border-radius: 8px 12px 10px 14px / 12px 8px 14px 10px;
        }
        .circle-sketch {
            border: 3px solid #334155;
            border-radius: 48% 52% 54% 46% / 55% 45% 55% 45%;
        }
        .hand-drawn-icon {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;
            filter: drop-shadow(1px 1px 0px rgba(0,0,0,0.1));
        }
        .flourish {
            pointer-events: none;
            user-select: none;
            font-family: 'Gochi Hand', cursive;
        }
        .active-tab-glow {
            box-shadow: 0 0 20px rgba(253, 224, 71, 0.4);
        }
    </style>
</head>
<body class="bg-background-light dot-grid min-h-screen transition-colors duration-300 font-sans overflow-x-hidden">
<div class="max-w-6xl mx-auto pt-32 px-6">
<header class="mb-24 text-center">
<h1 class="font-display text-6xl mb-4 text-slate-800 tracking-tight">Math Sketchpad</h1>
<p class="font-sketch text-2xl text-slate-500">Fancy Hand-Drawn Developer Reference</p>
</header>
<div class="relative flex justify-center items-center">
<div class="absolute -top-12 left-1/4 flourish text-yellow-500 opacity-60 rotate-12">
<span class="material-symbols-outlined text-4xl">star</span>
</div>
<div class="absolute -top-8 right-1/4 flourish text-blue-400 opacity-40 -rotate-12">
<span class="material-symbols-outlined text-5xl">auto_fix_high</span>
</div>
<div class="absolute bottom-[-60px] left-1/3 flourish text-slate-400 opacity-50">
<span class="material-symbols-outlined text-3xl">south_east</span>
<span class="block text-sm">Pick one!</span>
</div>
<nav class="flex flex-wrap justify-center items-end gap-12 relative z-10">
<div class="relative group">
<div class="absolute -top-6 -left-6 flourish text-amber-500">
<span class="material-symbols-outlined text-3xl">draw</span>
</div>
<button class="bg-stickyNote p-10 sticky-note-shape active-tab-glow border-2 transition-all hover:scale-105 hover:-rotate-1 cursor-pointer flex flex-col items-center gap-2 min-w-[180px]">
<span class="material-symbols-outlined text-6xl text-slate-800 hand-drawn-icon">edit_note</span>
<span class="font-display text-xl font-black text-slate-800">TEXT</span>
</button>
</div>
<div class="relative group">
<div class="absolute -top-8 -right-8 flourish text-teal-500 rotate-45">
<span class="material-symbols-outlined text-4xl">magic_button</span>
</div>
<button class="bg-white p-10 dashed-sketch-border transition-all hover:bg-slate-50 hover:scale-105 cursor-pointer flex flex-col items-center gap-2 min-w-[180px]">
<span class="material-symbols-outlined text-6xl text-slate-600 hand-drawn-icon">photo_camera</span>
<span class="font-display text-xl font-bold text-slate-600">SNAP &amp; SOLVE</span>
</button>
</div>
<div class="relative group">
<div class="absolute -bottom-10 -right-6 flourish text-pink-400 opacity-60">
<span class="material-symbols-outlined text-4xl">favorite</span>
</div>
<button class="bg-white w-44 h-44 circle-sketch transition-all hover:bg-slate-50 hover:scale-105 cursor-pointer flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-6xl text-slate-600 hand-drawn-icon">mic_external_on</span>
<span class="font-display text-xl font-bold text-slate-600">VOICE</span>
</button>
</div>
</nav>
</div>
<div class="mt-40 border-t border-dashed border-slate-200 pt-10 flex justify-between items-center px-10 opacity-30 select-none">
<div class="flex gap-8 font-sketch text-4xl">
<span class="rotate-6">y = mx + b</span>
<span class="-rotate-3">E = mc²</span>
</div>
<div class="flex gap-4">
<span class="material-symbols-outlined text-4xl">ink_pen</span>
<span class="material-symbols-outlined text-4xl">square_foot</span>
</div>
</div>
</div>
<div class="fixed bottom-8 right-8 flex flex-col gap-4">
<button class="p-4 rounded-full bg-white shadow-lg border-2 border-slate-200 text-slate-600 hover:rotate-12 transition-transform" title="Sketchpad Mode">
<span class="material-symbols-outlined text-3xl">brush</span>
</button>
</div>

</body></html>
