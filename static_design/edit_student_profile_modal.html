<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Student Profile | uask.ai</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #282e39;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-white min-h-screen flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-[640px] bg-[#1a1d23] border border-[#282e39] rounded-xl shadow-2xl overflow-hidden">
<!-- Header Section -->
<div class="px-8 pt-8 pb-4">
<div class="flex items-center justify-between mb-6">
<h2 class="text-2xl font-bold leading-tight tracking-tight">Edit Student Profile</h2>
<button class="text-[#9da6b9] hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Profile Header Component -->
<div class="flex items-center gap-6 bg-[#21262e] p-5 rounded-xl border border-[#2d343f]">
<div class="relative group cursor-pointer">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-24 w-24 border-2 border-primary" data-alt="Close up of a student avatar with a blue highlight" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBv2QouASd0RsFoFeibVNu5wnKJR4UVGe5soIX-_AoIvE3hdXBFJskQnMZ-dqSEWE8w4nwCSEt-X8WwGTEEZpLlKN82SiW3qH8YEWVOnFwfbRx9H-embTQZTkjgtaOZ5_KRyj6OqUulZlRcGv2vY3jQdUUYVmAe1QN7AAT_UUwAAYvQxRBZ2fOhEu4HKYG8CWFDC5US41rFuO8XAcbJuXMhcQVgraD6lXJgicHDKHPewqxO6K_QGrtuKnirMWR8bPd7vpFPt1DAvfH6");'>
</div>
<div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white text-xl">photo_camera</span>
</div>
</div>
<div class="flex flex-col">
<p class="text-white text-xl font-bold leading-tight">Alex Johnson</p>
<p class="text-[#9da6b9] text-sm font-normal">Student ID: 884920 • uask.ai Member</p>
<button class="text-primary text-sm font-semibold mt-2 flex items-center gap-1 hover:underline">
                        Change avatar
                    </button>
</div>
</div>
</div>
<!-- Scrollable Form Content -->
<div class="px-8 pb-6 max-h-[60vh] overflow-y-auto custom-scrollbar">
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">
<!-- TextFields -->
<div class="col-span-1">
<label class="flex flex-col gap-2">
<span class="text-[#9da6b9] text-sm font-semibold uppercase tracking-wider">Display Name</span>
<input class="form-input w-full rounded-lg text-white border-none bg-[#282e39] focus:ring-2 focus:ring-primary h-12 px-4 text-base font-normal placeholder:text-[#5d6574]" placeholder="Enter your name" type="text" value="Alex Johnson"/>
</label>
</div>
<div class="col-span-1">
<label class="flex flex-col gap-2">
<span class="text-[#9da6b9] text-sm font-semibold uppercase tracking-wider">Email Address</span>
<input class="form-input w-full rounded-lg text-[#9da6b9] border-none bg-[#282e39]/50 cursor-not-allowed h-12 px-4 text-base font-normal" disabled="" type="email" value="alex.j@university.edu"/>
</label>
</div>
<!-- Academic Level Dropdown -->
<div class="col-span-2">
<label class="flex flex-col gap-2">
<span class="text-[#9da6b9] text-sm font-semibold uppercase tracking-wider">Academic Level</span>
<div class="relative">
<select class="form-select w-full rounded-lg text-white border-none bg-[#282e39] focus:ring-2 focus:ring-primary h-12 px-4 text-base font-normal appearance-none cursor-pointer">
<option value="high-school">High School</option>
<option selected="" value="college">College / Undergraduate</option>
<option value="graduate">Graduate Student</option>
<option value="phd">PhD / Researcher</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#9da6b9]">expand_more</span>
</div>
</label>
</div>
<!-- Learning Interests (Chips) -->
<div class="col-span-2">
<span class="text-[#9da6b9] text-sm font-semibold uppercase tracking-wider block mb-3">Learning Interests</span>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full bg-primary text-white text-sm font-medium flex items-center gap-2 border border-primary">
                            Physics <span class="material-symbols-outlined text-xs">close</span>
</button>
<button class="px-4 py-2 rounded-full bg-primary text-white text-sm font-medium flex items-center gap-2 border border-primary">
                            Calculus <span class="material-symbols-outlined text-xs">close</span>
</button>
<button class="px-4 py-2 rounded-full bg-primary text-white text-sm font-medium flex items-center gap-2 border border-primary">
                            Algebra <span class="material-symbols-outlined text-xs">close</span>
</button>
<button class="px-4 py-2 rounded-full bg-[#282e39] text-[#9da6b9] text-sm font-medium border border-transparent hover:border-[#424b5a] hover:text-white transition-all">
                            + Quantum Mechanics
                        </button>
<button class="px-4 py-2 rounded-full bg-[#282e39] text-[#9da6b9] text-sm font-medium border border-transparent hover:border-[#424b5a] hover:text-white transition-all">
                            + Thermodynamics
                        </button>
</div>
</div>
<!-- Security & Privacy -->
<div class="col-span-2 mt-4 pt-6 border-t border-[#282e39]">
<div class="flex flex-col gap-6">
<!-- Toggle -->
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-white text-base font-semibold">Public Profile</span>
<span class="text-[#9da6b9] text-xs">Allow other students to see your study progress and interests.</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-[#282e39] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Change Password Link -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#9da6b9]">lock</span>
<span class="text-white text-base font-medium">Security</span>
</div>
<a class="text-primary font-semibold text-sm hover:underline" href="#">Change Password</a>
</div>
</div>
</div>
</div>
</div>
<!-- Sticky Footer -->
<div class="px-8 py-6 bg-[#1a1d23] border-t border-[#282e39] flex justify-end gap-3">
<button class="px-6 py-2.5 rounded-lg text-white font-semibold text-sm bg-[#282e39] hover:bg-[#343b48] transition-colors">
                Cancel
            </button>
<button class="px-8 py-2.5 rounded-lg text-white font-semibold text-sm bg-primary hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all">
                Save Profile
            </button>
</div>
</div>
</body></html>
