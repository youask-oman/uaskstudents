<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Share Question - Math Sketchpad</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Gochi+Hand&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"],
                        "hand": ["Gochi Hand", "cursive"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .sketch-border {
            border: 2px solid currentColor;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .sketch-bg {
            background-image: radial-gradient(#3a2a21 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .marker-highlight {
            background: #facc15;
            box-shadow: 2px 8px 15px -5px rgba(250, 204, 21, 0.5);
            transform: rotate(-1deg);
            border-radius: 2% 98% 3% 97% / 96% 3% 97% 4%;
        }
        .wobbly-line {
            border-bottom: 2px solid currentColor;
            border-radius: 100% 0% 100% 0% / 100% 0% 100% 0%;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-stone-800 dark:text-stone-200 min-h-screen flex items-center justify-center p-6 sketch-bg">
<!-- Modal Backdrop (simulated) -->
<div class="fixed inset-0 bg-background-dark/80 backdrop-blur-sm flex items-center justify-center p-4">
<!-- Main Popup Container -->
<div class="relative w-full max-w-md bg-[#2d1e16] border-4 border-[#4a3528] p-8 shadow-2xl transform rotate-1" style="border-radius: 15px 225px 25px 255px/225px 25px 255px 25px;">
<!-- Header Section -->
<div class="flex justify-between items-center mb-8">
<h2 class="font-hand text-4xl text-white tracking-wide">Share Question</h2>
<button class="group relative p-2 transition-transform hover:scale-110 active:scale-95">
<span class="material-symbols-outlined text-primary text-3xl font-bold">close</span>
<!-- Scribble effect circle -->
<svg class="absolute inset-0 w-full h-full opacity-0 group-hover:opacity-100 text-primary" viewbox="0 0 100 100">
<path d="M50,10 C20,10 10,40 10,50 C10,70 30,90 50,90 C70,90 90,70 90,50 C90,30 70,10 50,10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
</svg>
</button>
</div>
<!-- Selection Options -->
<div class="grid grid-cols-2 gap-6 mb-8">
<!-- Private Option -->
<div class="relative group cursor-pointer p-4 border-2 border-stone-500/40 hover:border-stone-400 transition-all text-center flex flex-col items-center gap-2" style="border-radius: 120px 15px 100px 15px/15px 100px 15px 120px;">
<span class="material-symbols-outlined text-3xl text-stone-400">lock</span>
<span class="font-hand text-xl text-stone-300">Private</span>
</div>
<!-- Public Option (Active State) -->
<div class="relative p-4 text-center flex flex-col items-center gap-2 marker-highlight cursor-pointer transform -rotate-2">
<span class="material-symbols-outlined text-3xl text-background-dark font-bold">public</span>
<span class="font-hand text-xl text-background-dark font-bold">Public</span>
<!-- Hand-drawn Checkmark -->
<div class="absolute -top-3 -right-2 bg-primary text-white p-1 rounded-full border-2 border-white transform rotate-12 shadow-lg">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
</div>
<!-- URL Field Section -->
<div class="mb-8">
<label class="block font-hand text-2xl text-stone-300 mb-3 ml-2">Shareable Link</label>
<div class="relative group">
<div class="flex items-center gap-2 p-4 bg-[#1a110b] border-2 border-dashed border-stone-600 text-stone-300" style="border-radius: 255px 25px 225px 25px/25px 225px 25px 255px;">
<span class="flex-1 font-display text-sm truncate opacity-80">https://sketchpad.math/q/3a9f-2k81-v9l2</span>
<button class="flex items-center gap-2 bg-primary/20 hover:bg-primary/30 text-primary px-3 py-1 border border-primary/40 transition-colors" style="border-radius: 15px 5px 15px 5px;">
<span class="material-symbols-outlined text-lg">content_copy</span>
<span class="font-hand text-lg">Copy</span>
</button>
</div>
<!-- Scribble underline -->
<svg class="absolute -bottom-2 left-0 w-full h-4 text-primary/30" preserveaspectratio="none" viewbox="0 0 100 10">
<path d="M0,5 Q25,0 50,5 T100,5" fill="none" stroke="currentColor" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-white py-4 mb-6 font-hand text-2xl shadow-[6px_6px_0px_0px_rgba(0,0,0,0.3)] hover:shadow-none hover:translate-x-1 hover:translate-y-1 transition-all flex items-center justify-center gap-3" style="border-radius: 15px 125px 15px 155px/125px 15px 155px 15px;">
<span class="material-symbols-outlined font-bold">share</span>
                Share to Classroom
            </button>
<!-- Footer Info -->
<div class="flex items-start gap-3 px-2">
<div class="mt-1">
<span class="material-symbols-outlined text-primary text-xl">info</span>
</div>
<p class="text-stone-400 text-sm italic font-display leading-tight">
                    Anyone with this link will be able to view and duplicate your sketch. Private settings only allow you to view it.
                </p>
</div>
<!-- Decorative graphite doodles -->
<div class="absolute -bottom-12 -left-8 pointer-events-none opacity-40 transform -rotate-12">
<svg class="text-stone-500" height="100" viewbox="0 0 100 100" width="100">
<path d="M10,10 Q50,90 90,10 M30,50 L70,50" fill="none" stroke="currentColor" stroke-dasharray="4 2" stroke-width="2"></path>
</svg>
</div>
<div class="absolute -top-10 -right-4 pointer-events-none opacity-30 transform rotate-45">
<svg class="text-stone-500" height="80" viewbox="0 0 100 100" width="80">
<circle cx="50" cy="50" fill="none" r="30" stroke="currentColor" stroke-width="1"></circle>
<path d="M20,20 L80,80 M80,20 L20,80" fill="none" stroke="currentColor" stroke-width="1"></path>
</svg>
</div>
</div>
</div>
<!-- Background Elements to context -->
<div class="fixed top-10 left-10 opacity-20 hidden lg:block">
<div class="font-hand text-6xl text-primary rotate-[-15deg]">x² + y² = r²</div>
</div>
<div class="fixed bottom-10 right-10 opacity-20 hidden lg:block">
<img class="w-48 grayscale contrast-125" data-alt="Sketch of a geometric triangle and circle" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOgd9wUzjTkfz3zDlymNkVSVbLpJoopDX6b_POCwnj39RjSZjsHAZ3wytcUp8m3mU--1jH36jnJanGrcX0SjbHKdGp_qUyMXMp3jXYY91_IXFxNlGetbV88fjrgnbvuQkF21fpPz6nGPSbwlHFdObwgBX-l-N3n4aA4sF9oIUIEzKZlxSJdU2tgRiHIVR1w5hm8LEpbNZkXxGbhU5DR_iwg8XNub3n_VUFvPW5YQhfU-NxSxMPseOH5O-MomZ46GOSebDIPRWXCbc"/>
</div>
</body></html>
