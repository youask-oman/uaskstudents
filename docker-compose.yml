name: uaskstudents

services:
  orchestrator:
    image: uask-orchestrator:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: orchestrator
    container_name: uask_orchestrator
    command: >
      bash -c "pip install filetype tiktoken && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://uask_user:uask_password@postgres:5432/uask_db
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
      API_BACKEND_SCHEME: http
      API_BACKEND_HOST: 127.0.0.1
      API_BACKEND_PORT: "8000"
      MPLBACKEND: Agg
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TIMEOUT_SECONDS: "180"
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "25"
      OLLAMA_CONNECT_RETRIES: "6"
      OLLAMA_RETRY_BACKOFF_MS: "500"
      DB_POOL_PRE_PING: "true"
      DB_POOL_SIZE: "30"
      DB_MAX_OVERFLOW: "30"
      DB_POOL_TIMEOUT_SECONDS: "8"
      DB_POOL_RECYCLE_SECONDS: "1800"
      API_MAX_CONCURRENT_REQUESTS: "60"
      API_CONCURRENCY_ACQUIRE_TIMEOUT_MS: "150"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"" ]
      interval: 15s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: false
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    volumes:
      - storage_data:/app/storage
      - ./static_design:/static_design:ro
      - ./backend/data:/app/data:ro
      - ./backend:/app
      - .:/src:ro
      - ./reports:/src/reports
      - ./test-results:/src/test-results

  stripe_cli:
    image: stripe/stripe-cli:latest
    command: listen --forward-to http://host.docker.internal:9000/api/webhooks/stripe
    volumes:
      - ./.stripe:/root/.config/stripe
    restart: unless-stopped
    profiles: ["stripe"]

  worker:
    image: uask-worker:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: uask_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://uask_user:uask_password@postgres:5432/uask_db
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TIMEOUT_SECONDS: "180"
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "25"
      OLLAMA_CONNECT_RETRIES: "6"
      OLLAMA_RETRY_BACKOFF_MS: "500"

      LOCAL_STORAGE_PATH: /app/storage
      OCR_FAST_MODE: "1"
      OCR_MAX_FIGURE_REFINEMENTS: "1"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      PIX2TEXT_HOME: /tmp/pix2text
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      ULTRALYTICS_CONFIG_DIR: /tmp/Ultralytics
      YOLO_RUNS_DIR: /tmp/Ultralytics/runs
      RUNS_DIR: /tmp/Ultralytics/runs
      # OCR Engine: openai or local (pix2text)
      OCR_ENGINE: ${OCR_ENGINE:-openai}
      VLM_MODEL_OCR: ${VLM_MODEL_OCR}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped
    stop_grace_period: 60s
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-4}
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
    read_only: false
    tmpfs:
      - /tmp
    volumes:
      - storage_data:/app/storage
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  worker_whatsapp:
    image: uask-worker:prod
    container_name: uask_worker_whatsapp
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://uask_user:uask_password@postgres:5432/uask_db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TIMEOUT_SECONDS: "180"
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "25"
      OLLAMA_CONNECT_RETRIES: "6"
      OLLAMA_RETRY_BACKOFF_MS: "500"
      LOCAL_STORAGE_PATH: /app/storage
      OCR_FAST_MODE: "1"
      OCR_MAX_FIGURE_REFINEMENTS: "1"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      PIX2TEXT_HOME: /tmp/pix2text
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      ULTRALYTICS_CONFIG_DIR: /tmp/Ultralytics
      YOLO_RUNS_DIR: /tmp/Ultralytics/runs
      RUNS_DIR: /tmp/Ultralytics/runs
      OCR_ENGINE: ${OCR_ENGINE:-openai}
      VLM_MODEL_OCR: ${VLM_MODEL_OCR}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${WHATSAPP_WORKER_CONCURRENCY:-2} -Q whatsapp
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - storage_data:/app/storage
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  postgres:
    image: postgres:16-alpine
    container_name: uask_postgres
    environment:
      POSTGRES_USER: uask_user
      POSTGRES_PASSWORD: uask_password
      POSTGRES_DB: uask_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uask_user -d uask_db" ]
      interval: 10s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: uask_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 20

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600 # I added to Check every hour (adjust as needed)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: postgres redis

volumes:
  postgres_data:
  redis_data:
  storage_data:


