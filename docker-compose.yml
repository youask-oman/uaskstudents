name: uaskstudents

services:
  orchestrator:
    image: uask-orchestrator:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: orchestrator
    container_name: uask_orchestrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://uask_user:uask_password@postgres:5432/uask_db
      REDIS_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"" ]
      interval: 15s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    volumes:
      - storage_data:/app/storage

  worker:
    image: uask-worker:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: uask_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://uask_user:uask_password@postgres:5432/uask_db
      REDIS_URL: redis://redis:6379/0

      LOCAL_STORAGE_PATH: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped
    stop_grace_period: 60s
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - storage_data:/app/storage
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  postgres:
    image: postgres:16-alpine
    container_name: uask_postgres
    environment:
      POSTGRES_USER: uask_user
      POSTGRES_PASSWORD: uask_password
      POSTGRES_DB: uask_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uask_user -d uask_db" ]
      interval: 10s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: uask_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:

  storage_data:
