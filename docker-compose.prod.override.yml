services:
  orchestrator:
    environment:
      API_MAX_CONCURRENT_REQUESTS: "70"
      API_CONCURRENCY_ACQUIRE_TIMEOUT_MS: "200"
      DB_POOL_PRE_PING: "true"
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "10"
      DB_POOL_TIMEOUT_SECONDS: "8"
      DB_POOL_RECYCLE_SECONDS: "1800"
      UVICORN_WORKERS: "1"
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 8

  worker:
    environment:
      WORKER_CONCURRENCY: "4"
      CELERYD_PREFETCH_MULTIPLIER: "1"
      CELERY_ACKS_LATE: "true"
      CELERY_TASK_TIME_LIMIT: "180"
      CELERY_TASK_SOFT_TIME_LIMIT: "150"
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4 -Q celery

  worker_whatsapp:
    environment:
      WHATSAPP_WORKER_CONCURRENCY: "2"
      CELERYD_PREFETCH_MULTIPLIER: "1"
      CELERY_ACKS_LATE: "true"
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 -Q whatsapp

  postgres:
    command: >
      postgres
      -c max_connections=250
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c wal_buffers=16MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9

  redis:
    command: redis-server --appendonly yes --save 60 1000 --maxmemory 2gb --maxmemory-policy allkeys-lru
